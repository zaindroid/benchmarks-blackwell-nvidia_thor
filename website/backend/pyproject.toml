[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thor-leaderboard-api"
version = "0.1.0"
description = "ThorBench leaderboard REST API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

[project.scripts]
thor-leaderboard = "main:run"

[tool.setuptools.packages.find]
where = ["src"]
