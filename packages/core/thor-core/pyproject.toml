[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thor-core"
version = "0.1.0"
description = "Core utilities for NVIDIA Thor AI platform"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pynvml>=11.5",
    "psutil>=5.9",
    "rich>=13.0",
    "typer>=0.9",
    "structlog>=24.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
tensorrt = ["tensorrt>=8.6", "cuda-python>=12.0"]
# Optional infrastructure backends (PostgreSQL, InfluxDB, Redis, experiment trackers)
db = ["asyncpg>=0.29"]
timeseries = ["influxdb-client>=1.40", "redis>=5.0"]
tracking = ["wandb>=0.16", "mlflow>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]
