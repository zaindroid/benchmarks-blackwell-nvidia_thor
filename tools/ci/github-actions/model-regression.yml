name: Model Regression Testing

# NOTE: GitHub Actions expects workflows under .github/workflows/.
# Copy this file there, or use it as a reference for your own CI.

on:
  pull_request:
    paths:
      - 'packages/benchmarks/**'
      - 'packages/benchmarks/thor-models/**'
      - 'packages/benchmarks/thor-benchmark/configs/**'

jobs:
  regression-test:
    runs-on: [self-hosted, linux, thor-device]

    steps:
      - uses: actions/checkout@v4

      - name: Setup database
        run: |
          docker compose -f tools/docker/docker-compose.yml up -d postgres
          sleep 5

      - name: Run benchmark suite (baseline + candidate)
        run: |
          thor-benchmark run --config packages/benchmarks/thor-benchmark/configs/yolov8n.yaml \
            --output results.json --report regression-report.md

      - name: Generate regression report
        run: |
          python tools/scripts/check_regression.py results.json || true

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'No regression report generated.';
            if (fs.existsSync('regression-report.md')) {
              report = fs.readFileSync('regression-report.md', 'utf8');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
