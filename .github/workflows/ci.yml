name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install -e packages/core/thor-core[db]
          pip install -e packages/core/thor-sdk
          pip install -e packages/benchmarks/thor-benchmark
          pip install -e packages/benchmarks/thor-models
          pip install -e "packages/core/thor-mcp[postgres]"
          pip install -e "website/backend[postgres]"
          pip install -e ".[dev]"
          pip install influxdb-client

      - name: Run package tests
        run: pytest packages/ -q

      - name: Run example + backend tests
        run: |
          pytest examples/thor-sense/tests -q
          pytest examples/thor-vlm/tests -q
          pytest website/backend/tests -q

      - name: Build frontend
        working-directory: website/frontend
        run: |
          npm ci
          npm run build
