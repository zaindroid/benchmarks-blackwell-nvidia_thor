# zorc platform manifest for the ThorMCP streamable-HTTP server.
# See docs/hosting-zorc.md for the full workflow.
name: thor-mcp
memory_mb: 512
port: 8000
# Optional: map a public domain to the MCP endpoint (/mcp).
domains:
  - mcp.thor.zaindroid.me
# database: true provisions a dedicated Postgres instance and sets
# DATABASE_URL before first start -> benchmark results persist.
# Set to false to keep the in-memory store.
database: true
env:
  # Internal secrets generated by zorc itself (never committed).
  MCP_SECRET_KEY: { GENERATE_ME: { generate: hex } }
  THOR_TOKEN: { GENERATE_ME: { generate: hex } }
