# Deployment manifest for the composed ThorAI platform app
# (MCP endpoint + leaderboard API + web UI). See docs/api-reference.md.
name: thor-platform
memory_mb: 512
port: 8000
# Public domain for the web UI + API + MCP endpoint.
domains:
  - thor.zaindroid.me
# database: true provisions a dedicated Postgres instance and sets
# DATABASE_URL before first start -> benchmark results persist.
database: true
env:
  # Internal secrets generated by the platform at deploy time.
  MCP_SECRET_KEY: { generate: hex }
  THOR_TOKEN: { generate: hex }
